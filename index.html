<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Principal - Ferramentas</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: bold;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border-bottom: 2px solid #ffcc00;
      padding-bottom: 10px;
    }

    /* Ajuste para os botões caberem em lista sem rolar demais */
    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #4caf50;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      text-align: left;
      padding-left: 20px;
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .btn i {
      margin-right: 15px;
      font-style: normal;
    }

    /* Cores Diferenciadas */
    .btn-resumo { background: #0056b3; }
    .btn-docas { background: #d32f2f; } /* Vermelho JSL */
    .btn-grafico { background: #673ab7; }
    .btn-calc { background: #ff9800; }

    .btn:hover {
      filter: brightness(1.1);
      transform: scale(1.02);
    }

    .footer-info {
      margin-top: 15px;
      font-size: 10px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Menu Principal</h2>

    <div class="menu-grid">
      <button class="btn btn-docas" onclick="location.href='gestaodedocas.html'">
        <span>🚛 Gestão de Docas 1-11</span>
      </button>

      <button class="btn btn-resumo" onclick="location.href='Geradorderesumo.html'">
        <span>📊 Gerador de Resumo</span>
      </button>

      <button class="btn btn-calc" onclick="location.href='Calculadoradefardos.html'">
        <span>🧮 Calculadora de Fardos</span>
      </button>

      <button class="btn" onclick="location.href='contadordesku.html'">
        <span>🔢 Contador de SKU</span>
      </button>

      <button class="btn btn-grafico" onclick="location.href='geradordegrafico.html'">
        <span>📈 Gerador de Gráfico</span>
      </button>

      <button class="btn" onclick="location.href='Geradordeqrcode.html'">
        <span>🤖 Gerador de QR Code</span>
      </button>

      <button class="btn" onclick="location.href='Qrcodeteste.html'">
        <span>🔄 QR Code to Login</span>
      </button>
    </div>

    <div class="footer-info">
      v1.0 - Operação JSL
    </div>
  </div>

</body>
</html>
