<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Principal - Ferramentas Operação</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: #fff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #333;
      border-bottom: 2px solid #ed1c24;
      padding-bottom: 10px;
    }

    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      text-align: left;
      padding-left: 15px;
      color: white;
    }

    .btn:hover {
      filter: brightness(1.1);
      transform: scale(1.02);
    }

    /* Cores */
    .docas { background: #d32f2f; }
    .dashboard { background: #004a99; }
    .grafico { background: #673ab7; }
    .expedicao { background: #00897b; }
    .calc { background: #ff9800; }
    .sku { background: #455a64; }
    .qr { background: #2e7d32; }

    .footer {
      margin-top: 15px;
      font-size: 11px;
      color: #777;
    }

  </style>
</head>
<body>

<div class="container">

  <h2>🚛 Ferramentas Operação JSL</h2>

  <div class="menu-grid">

    <button class="btn docas" onclick="location.href='gestaodedocas.html'">
      🚛 Gestão de Docas
    </button>

    <button class="btn dashboard" onclick="location.href='dashboarddecargabc.html'">
      📊 Dashboard Turno BC
    </button>

    <button class="btn grafico" onclick="location.href='geradordegrafico.html'">
      📈 Gerador de Gráfico de Cargas
    </button>

    <button class="btn expedicao" onclick="location.href='sistemadeexpedição.html'">
      🏆 Sistema de Expedição (Ranking)
    </button>

    <button class="btn dashboard" onclick="location.href='Geradorderesumo.html'">
      📋 Gerador de Resumo
    </button>

    <button class="btn calc" onclick="location.href='Calculadoradefardos.html'">
      🧮 Calculadora de Fardos
    </button>

    <button class="btn sku" onclick="location.href='contadordesku.html'">
      🔢 Contador de SKU
    </button>

    <button class="btn qr" onclick="location.href='Geradordeqrcode.html'">
      🤖 Gerador de QR Code
    </button>

    <button class="btn qr" onclick="location.href='Qrcodeteste.html'">
      🔄 QR Code Login
    </button>

        <button class="btn qr" onclick="location.href='juntar-pdfs.html'">
      🔛 juntar pdf
    </button>

            <button class="btn qr" onclick="location.href='identificacao-armario.html'">
      🛄 identificação de armario
    </button>

                <button class="btn qr" onclick="location.href='recebimento.html'">
      🚚 recebimento
    </button>

  </div>

  <div class="footer">
    Sistema Interno v2.0
  </div>

</div>

</body>
</html>
