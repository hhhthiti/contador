<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aba Recebimento - NF-e PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.min.mjs" type="module"></script>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: #f2f5f9; }
    .container { max-width: 1200px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 3px 12px rgba(0,0,0,.08); padding: 16px; margin-bottom: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #cf102d; padding-bottom: 10px; margin-bottom: 12px; }
    .logos { display: flex; gap: 12px; align-items: center; }
    .logos img { height: 38px; object-fit: contain; }
    h1 { margin: 0; color: #cf102d; font-size: 1.35rem; }
    .muted { color: #58616b; font-size: .92rem; }
    .row { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 10px; align-items: end; }
    input[type=file], input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cfd7df; border-radius: 8px; }
    .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    button { border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #005bbb; color: #fff; }
    .btn-success { background: #1f8a3b; color: #fff; }
    .btn-gray { background: #6b7280; color: #fff; }
    .erro { background: #ffd7db; color: #8c0017; padding: 8px; border-radius: 8px; display: none; margin-top: 8px; }
    .debug { font-family: monospace; color: #3f4b5a; font-size: .82rem; margin-top: 8px; white-space: pre-wrap; }

    #resultado { display: none; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 12px 0; }
    .kpi { background: #003f88; color: #fff; border-radius: 8px; padding: 10px; }
    .kpi span { font-size: .84rem; opacity: .9; display:block; }
    .kpi b { font-size: 1.2rem; }
    .nota-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin: 10px 0; }
    .nota-item { background: #f6f9ff; border: 1px solid #d7e3f6; border-radius: 8px; padding: 8px; }
    .nota-item span { font-size: .78rem; color: #4a5568; display: block; }
    .nota-item b { font-size: .92rem; color: #1f2937; word-break: break-word; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { border: 1px solid #dadada; padding: 8px; text-align: left; }
    th { background: #003f88; color: #fff; }
    tr:nth-child(even) { background: #f8fbff; }

    @media print {
      body { background: #fff; padding: 0; }
      .no-print { display: none !important; }
      .card { box-shadow: none; margin: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card no-print">
      <div class="header">
        <div>
          <h1>Aba Recebimento</h1>
          <div class="muted">Suba o PDF ou XML da NF-e para identificar NFe (9 dígitos), CÓD. e DESCRIÇÃO. Preencha paletes por item e imprima para operação.</div>
        </div>
        <div class="logos">
          <img src="icons/JSL.png" alt="Logo JSL" />
          <img src="icons/suzano.svg" alt="Logo Suzano" />
        </div>
      </div>

      <div class="row">
        <div>
          <label><b>Arquivo da NF-e (PDF/XML)</b></label>
          <input id="pdfInput" type="file" accept="application/pdf,.xml,text/xml,application/xml" />
        </div>
        <div>
          <label><b>Número NF-e (manual, opcional)</b></label>
          <input id="nfeManual" type="text" placeholder="Ex.: 000060701" />
        </div>
        <div>
          <label><b>Data</b></label>
          <input id="dataHoje" type="text" readonly />
        </div>
      </div>

      <div class="btns">
        <button class="btn-primary" onclick="processarArquivo()">Ler Arquivo</button>
        <button class="btn-success" onclick="imprimirRelatorio()">Imprimir</button>
        <button class="btn-gray" onclick="limparTudo()">Limpar</button>
      </div>

      <div id="erro" class="erro"></div>
      <div id="debug" class="debug"></div>
    </div>

    <div id="resultado" class="card">
      <div id="areaPrint">
        <div class="header">
          <div class="logos">
            <img src="icons/JSL.png" alt="Logo JSL" />
            <img src="icons/suzano.svg" alt="Logo Suzano" />
          </div>
          <div style="text-align:right">
            <div style="font-weight:700; color:#cf102d;">RECEBIMENTO OPERAÇÃO</div>
            <small id="dataImpressao"></small>
          </div>
        </div>

        <div class="kpis">
          <div class="kpi"><span>NF-e</span><b id="kpiNfe">-</b></div>
          <div class="kpi"><span>Total de itens</span><b id="kpiItens">0</b></div>
          <div class="kpi"><span>Total paletes</span><b id="kpiPaletes">0</b></div>
        </div>

        <div id="dadosNota" class="nota-grid"></div>

        <table>
          <thead>
            <tr>
              <th style="width:120px">CÓD.</th>
              <th>DESCRIÇÃO DO PRODUTO/SERVIÇO</th>
              <th style="width:180px">Paletes recebidos</th>
            </tr>
          </thead>
          <tbody id="tbodyItens"></tbody>
        </table>
      </div>
    </div>
  </div>

<script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.min.mjs';

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.worker.min.mjs';

  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('dataHoje').value = new Date().toLocaleDateString('pt-BR');
  });

  window.processarArquivo = async function processarArquivo() {
    limparErro();
    const input = document.getElementById('pdfInput');
    const file = input.files[0];

    if (!file) {
      mostrarErro('Selecione um arquivo PDF ou XML para leitura.');
      return;
    }

    try {
      const nome = (file.name || '').toLowerCase();
      const tipo = (file.type || '').toLowerCase();

      if (nome.endsWith('.xml') || tipo.includes('xml')) {
        document.getElementById('debug').textContent = 'Lendo XML da NF-e...';
        const xmlText = await file.text();
        const dadosXml = extrairDadosXml(xmlText);

        if (!dadosXml.itens.length) {
          mostrarErro('Não consegui localizar itens no XML da NF-e.');
          return;
        }

        const nfeManual = somenteDigitos(document.getElementById('nfeManual').value);
        const nfe = nfeManual || dadosXml.nfe || '-';
        montarTabela(dadosXml.itens, nfe, dadosXml.nota);
        document.getElementById('debug').textContent = `XML lido com sucesso. Itens encontrados: ${dadosXml.itens.length}`;
        return;
      }

      document.getElementById('debug').textContent = 'Lendo texto do PDF...';
      const bytes = new Uint8Array(await file.arrayBuffer());
      const doc = await pdfjsLib.getDocument({ data: bytes }).promise;

      let textoCompleto = '';
      for (let p = 1; p <= doc.numPages; p++) {
        const page = await doc.getPage(p);
        const tc = await page.getTextContent();
        const textoPagina = tc.items.map(i => i.str).join(' ');
        textoCompleto += '\n' + textoPagina;
      }

      const nfeManual = somenteDigitos(document.getElementById('nfeManual').value);
      const nfe = nfeManual || extrairNfe(textoCompleto) || '-';
      const itens = extrairItens(textoCompleto);

      if (!itens.length) {
        mostrarErro('Não consegui localizar os itens (CÓD. e DESCRIÇÃO) no PDF.');
        document.getElementById('debug').textContent = 'Dica: tente um PDF de DANFE textual (não somente imagem escaneada).';
        return;
      }

      montarTabela(itens, nfe, null);
      document.getElementById('debug').textContent = `PDF lido com sucesso. Itens encontrados: ${itens.length}`;
    } catch (err) {
      mostrarErro('Falha ao processar o arquivo: ' + err);
    }
  };

  window.imprimirRelatorio = function imprimirRelatorio() {
    const visivel = document.getElementById('resultado').style.display !== 'none';
    if (!visivel) {
      mostrarErro('Gere o relatório antes de imprimir.');
      return;
    }
    window.print();
  };

  window.limparTudo = function limparTudo() {
    document.getElementById('pdfInput').value = '';
    document.getElementById('nfeManual').value = '';
    document.getElementById('debug').textContent = '';
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('tbodyItens').innerHTML = '';
    document.getElementById('kpiNfe').textContent = '-';
    document.getElementById('kpiItens').textContent = '0';
    document.getElementById('kpiPaletes').textContent = '0';
    document.getElementById('dadosNota').innerHTML = '';
    limparErro();
  };

  function extrairNfe(texto) {
    const t = String(texto || '');

    const padroes = [
      /N[ºo\.]?\s*0*(\d{9})/i,
      /NFE\s*0*(\d{9})/i,
      /No\.\s*0*(\d{9})/i,
      /N\s*\.?\s*0*(\d{9})/i
    ];

    for (const r of padroes) {
      const m = t.match(r);
      if (m) return m[1].padStart(9, '0');
    }

    const fallback = t.match(/\b\d{9}\b/);
    return fallback ? fallback[0] : null;
  }

  function extrairItens(texto) {
    const blocoProdutos = extrairBlocoProdutos(texto);
    const t = String(blocoProdutos || '').replace(/\s+/g, ' ').trim();
    if (!t) return [];
    const itens = [];

    // Captura linhas de produto no padrão DANFE:
    // CODIGO(8) + DESCRICAO + NCM(8) + CST(3) + CFOP(4) + UN
    const re = /(?:^|\s)(\d{8})\s+(.{3,120}?)\s+(\d{8})\s+\d{3}\s+\d{4}\s+[A-Z]{2,4}\s+\d+[.,]\d{3}/g;
    let m;

    while ((m = re.exec(t)) !== null) {
      const cod = m[1];
      const descricao = m[2]
        .replace(/\*+/g, '')
        .replace(/\s+/g, ' ')
        .trim();

      if (!cod || !descricao) continue;
      if (/^0+$/.test(cod)) continue;
      if (descricao.length > 120) continue;
      if (itens.some(i => i.cod === cod && i.descricao === descricao)) continue;

      itens.push({ cod, descricao });
    }

    return itens;
  }

  function extrairBlocoProdutos(texto) {
    const original = String(texto || '');
    if (!original) return '';

    // Versão normalizada para localizar marcadores, mantendo mapeamento por índice aproximado.
    const normalizado = original
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toUpperCase();

    const inicioMarcadores = [
      'DADOSDOSPRODUTOS/SERVICOS',
      'DADOS DOS PRODUTOS/SERVICOS',
      'DADOSDOSPRODUTOS',
      'DADOS DOS PRODUTOS'
    ];
    const fimMarcadores = [
      'DADOSADICIONAIS',
      'DADOS ADICIONAIS',
      'INFORMACOESCOMPLEMENTARES',
      'INFORMACOES COMPLEMENTARES'
    ];

    let inicio = -1;
    for (const m of inicioMarcadores) {
      inicio = normalizado.indexOf(m);
      if (inicio >= 0) break;
    }
    if (inicio < 0) return original;

    let fim = -1;
    for (const m of fimMarcadores) {
      fim = normalizado.indexOf(m, inicio);
      if (fim >= 0) break;
    }
    if (fim < 0) fim = original.length;

    return original.slice(inicio, fim);
  }

  function extrairDadosXml(xmlText) {
    const parser = new DOMParser();
    const xml = parser.parseFromString(String(xmlText || ''), 'application/xml');

    const erro = xml.getElementsByTagName('parsererror')[0];
    if (erro) return { nfe: null, itens: [], nota: null };

    const nNF =
      getTagText(xml, 'nNF') ||
      getTagText(xml, 'NNF') ||
      getTagText(xml, 'ide_nNF');
    const nfe = nNF ? somenteDigitos(nNF).padStart(9, '0').slice(-9) : null;

    const emitNome = getTagText(xml, 'xNome') || '-';
    const emitCnpj = getTagText(xml, 'CNPJ') || '-';
    const destNome = getTagTextByPath(xml, ['dest', 'xNome']) || '-';
    const destCnpj = getTagTextByPath(xml, ['dest', 'CNPJ']) || '-';
    const dhEmi = getTagText(xml, 'dhEmi') || getTagText(xml, 'dEmi') || '-';
    const chave = extrairChaveAcessoXml(xml) || '-';

    const dets = Array.from(xml.getElementsByTagNameNS('*', 'det'));
    const itens = dets.map(det => {
      const prod = det.getElementsByTagNameNS('*', 'prod')[0];
      if (!prod) return null;

      const cod = getTagText(prod, 'cProd') || getTagText(prod, 'CPROD');
      const desc = getTagText(prod, 'xProd') || getTagText(prod, 'XPROD');
      if (!cod || !desc) return null;

      return {
        cod: normalizarCodigoProduto(cod),
        descricao: String(desc).trim()
      };
    }).filter(Boolean);

    return {
      nfe,
      itens,
      nota: {
        emitNome,
        emitCnpj,
        destNome,
        destCnpj,
        emissao: formatarDataHora(dhEmi),
        chave
      }
    };
  }

  function getTagText(root, tagName) {
    if (!root) return null;
    const byNs = root.getElementsByTagNameNS('*', tagName);
    if (byNs && byNs[0]) return byNs[0].textContent;
    const byPlain = root.getElementsByTagName(tagName);
    if (byPlain && byPlain[0]) return byPlain[0].textContent;
    return null;
  }

  function montarTabela(itens, nfe, nota) {
    const tbody = document.getElementById('tbodyItens');
    tbody.innerHTML = '';

    itens.forEach((item, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${normalizarCodigoProduto(item.cod)}</td>
        <td>${item.descricao}</td>
        <td><input type="number" min="0" step="1" value="0" data-idx="${idx}" class="inp-palete" /></td>
      `;
      tbody.appendChild(tr);
    });

    document.querySelectorAll('.inp-palete').forEach(inp => {
      inp.addEventListener('input', atualizarTotalPaletes);
    });

    document.getElementById('kpiNfe').textContent = nfe;
    document.getElementById('kpiItens').textContent = String(itens.length);
    document.getElementById('dataImpressao').textContent = 'Gerado em ' + new Date().toLocaleString('pt-BR');
    preencherDadosNota(nota);
    atualizarTotalPaletes();

    document.getElementById('resultado').style.display = 'block';
  }

  function atualizarTotalPaletes() {
    const total = Array.from(document.querySelectorAll('.inp-palete'))
      .reduce((acc, el) => acc + (Number(el.value) || 0), 0);
    document.getElementById('kpiPaletes').textContent = String(total);
  }

  function somenteDigitos(v) {
    return String(v || '').replace(/\D/g, '');
  }

  function normalizarCodigoProduto(cod) {
    const dig = somenteDigitos(cod);
    if (!dig) return String(cod || '').trim();

    // Regra operacional pedida: quando houver muitos zeros à esquerda,
    // iniciar do primeiro "2" (caso exista). Senão, remove zeros à esquerda.
    const idx2 = dig.indexOf('2');
    if (idx2 > 0) return dig.slice(idx2);

    const semZeros = dig.replace(/^0+/, '');
    return semZeros || dig;
  }

  function preencherDadosNota(nota) {
    const alvo = document.getElementById('dadosNota');
    if (!nota) {
      alvo.innerHTML = '';
      return;
    }

    const campos = [
      ['Emitente', `${nota.emitNome} (${nota.emitCnpj})`],
      ['Destinatário', `${nota.destNome} (${nota.destCnpj})`],
      ['Emissão', nota.emissao || '-'],
      ['Chave de acesso', nota.chave || '-']
    ];

    alvo.innerHTML = campos.map(([k, v]) => `
      <div class="nota-item">
        <span>${k}</span>
        <b>${v || '-'}</b>
      </div>
    `).join('');
  }

  function formatarDataHora(valor) {
    if (!valor || valor === '-') return '-';
    const d = new Date(valor);
    return Number.isNaN(d.getTime()) ? String(valor) : d.toLocaleString('pt-BR');
  }

  function extrairChaveAcessoXml(xml) {
    const inf = xml.getElementsByTagNameNS('*', 'infNFe')[0] || xml.getElementsByTagName('infNFe')[0];
    const id = inf?.getAttribute('Id') || inf?.getAttribute('id') || '';
    const chave = String(id).replace(/^NFe/i, '');
    if (/^\d{44}$/.test(chave)) return chave;
    return getTagText(xml, 'chNFe') || null;
  }

  function getTagTextByPath(xml, path) {
    let atual = xml;
    for (const tag of path) {
      const prox = atual.getElementsByTagNameNS('*', tag)[0] || atual.getElementsByTagName(tag)[0];
      if (!prox) return null;
      atual = prox;
    }
    return atual.textContent || null;
  }

  function mostrarErro(msg) {
    const e = document.getElementById('erro');
    e.style.display = 'block';
    e.textContent = msg;
  }

  function limparErro() {
    const e = document.getElementById('erro');
    e.style.display = 'none';
    e.textContent = '';
  }
</script>
</body>
</html>
