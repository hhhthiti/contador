<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aba Recebimento - NF-e PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.min.mjs" type="module"></script>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: #f2f5f9; }
    .container { max-width: 1200px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 3px 12px rgba(0,0,0,.08); padding: 16px; margin-bottom: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #cf102d; padding-bottom: 10px; margin-bottom: 12px; }
    .logos { display: flex; gap: 12px; align-items: center; }
    .logos img { height: 38px; object-fit: contain; }
    h1 { margin: 0; color: #cf102d; font-size: 1.35rem; }
    .muted { color: #58616b; font-size: .92rem; }
    .row { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 10px; align-items: end; }
    input[type=file], input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cfd7df; border-radius: 8px; }
    .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    button { border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #005bbb; color: #fff; }
    .btn-success { background: #1f8a3b; color: #fff; }
    .btn-gray { background: #6b7280; color: #fff; }
    .erro { background: #ffd7db; color: #8c0017; padding: 8px; border-radius: 8px; display: none; margin-top: 8px; }
    .debug { font-family: monospace; color: #3f4b5a; font-size: .82rem; margin-top: 8px; white-space: pre-wrap; }

    #resultado { display: none; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 12px 0; }
    .kpi { background: #003f88; color: #fff; border-radius: 8px; padding: 10px; }
    .kpi span { font-size: .84rem; opacity: .9; display:block; }
    .kpi b { font-size: 1.2rem; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { border: 1px solid #dadada; padding: 8px; text-align: left; }
    th { background: #003f88; color: #fff; }
    tr:nth-child(even) { background: #f8fbff; }

    @media print {
      body { background: #fff; padding: 0; }
      .no-print { display: none !important; }
      .card { box-shadow: none; margin: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card no-print">
      <div class="header">
        <div>
          <h1>Aba Recebimento</h1>
          <div class="muted">Suba o PDF da NF-e para identificar NFe (9 dígitos), CÓD. e DESCRIÇÃO. Preencha paletes por item e imprima para operação.</div>
        </div>
        <div class="logos">
          <img src="icons/JSL.png" alt="Logo JSL" />
          <img src="icons/suzano.svg" alt="Logo Suzano" />
        </div>
      </div>

      <div class="row">
        <div>
          <label><b>PDF da NF-e</b></label>
          <input id="pdfInput" type="file" accept="application/pdf" />
        </div>
        <div>
          <label><b>Número NF-e (manual, opcional)</b></label>
          <input id="nfeManual" type="text" placeholder="Ex.: 000060701" />
        </div>
        <div>
          <label><b>Data</b></label>
          <input id="dataHoje" type="text" readonly />
        </div>
      </div>

      <div class="btns">
        <button class="btn-primary" onclick="processarPdf()">Ler PDF</button>
        <button class="btn-success" onclick="imprimirRelatorio()">Imprimir</button>
        <button class="btn-gray" onclick="limparTudo()">Limpar</button>
      </div>

      <div id="erro" class="erro"></div>
      <div id="debug" class="debug"></div>
    </div>

    <div id="resultado" class="card">
      <div id="areaPrint">
        <div class="header">
          <div class="logos">
            <img src="icons/JSL.png" alt="Logo JSL" />
            <img src="icons/suzano.svg" alt="Logo Suzano" />
          </div>
          <div style="text-align:right">
            <div style="font-weight:700; color:#cf102d;">RECEBIMENTO OPERAÇÃO</div>
            <small id="dataImpressao"></small>
          </div>
        </div>

        <div class="kpis">
          <div class="kpi"><span>NF-e</span><b id="kpiNfe">-</b></div>
          <div class="kpi"><span>Total de itens</span><b id="kpiItens">0</b></div>
          <div class="kpi"><span>Total paletes</span><b id="kpiPaletes">0</b></div>
        </div>

        <table>
          <thead>
            <tr>
              <th style="width:120px">CÓD.</th>
              <th>DESCRIÇÃO DO PRODUTO/SERVIÇO</th>
              <th style="width:180px">Paletes recebidos</th>
            </tr>
          </thead>
          <tbody id="tbodyItens"></tbody>
        </table>
      </div>
    </div>
  </div>

<script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.min.mjs';

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.worker.min.mjs';

  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('dataHoje').value = new Date().toLocaleDateString('pt-BR');
  });

  window.processarPdf = async function processarPdf() {
    limparErro();
    const input = document.getElementById('pdfInput');
    const file = input.files[0];

    if (!file) {
      mostrarErro('Selecione um PDF para leitura.');
      return;
    }

    document.getElementById('debug').textContent = 'Lendo texto do PDF...';

    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const doc = await pdfjsLib.getDocument({ data: bytes }).promise;

      let textoCompleto = '';
      for (let p = 1; p <= doc.numPages; p++) {
        const page = await doc.getPage(p);
        const tc = await page.getTextContent();
        const textoPagina = tc.items.map(i => i.str).join(' ');
        textoCompleto += '\n' + textoPagina;
      }

      const nfeManual = somenteDigitos(document.getElementById('nfeManual').value);
      const nfe = nfeManual || extrairNfe(textoCompleto) || '-';
      const itens = extrairItens(textoCompleto);

      if (!itens.length) {
        mostrarErro('Não consegui localizar os itens (CÓD. e DESCRIÇÃO) no PDF.');
        document.getElementById('debug').textContent = 'Dica: tente um PDF de DANFE textual (não somente imagem escaneada).';
        return;
      }

      montarTabela(itens, nfe);
      document.getElementById('debug').textContent = `PDF lido com sucesso. Itens encontrados: ${itens.length}`;
    } catch (err) {
      mostrarErro('Falha ao processar o PDF: ' + err);
    }
  };

  window.imprimirRelatorio = function imprimirRelatorio() {
    const visivel = document.getElementById('resultado').style.display !== 'none';
    if (!visivel) {
      mostrarErro('Gere o relatório antes de imprimir.');
      return;
    }
    window.print();
  };

  window.limparTudo = function limparTudo() {
    document.getElementById('pdfInput').value = '';
    document.getElementById('nfeManual').value = '';
    document.getElementById('debug').textContent = '';
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('tbodyItens').innerHTML = '';
    document.getElementById('kpiNfe').textContent = '-';
    document.getElementById('kpiItens').textContent = '0';
    document.getElementById('kpiPaletes').textContent = '0';
    limparErro();
  };

  function extrairNfe(texto) {
    const t = String(texto || '');

    const padroes = [
      /N[ºo\.]?\s*0*(\d{9})/i,
      /NFE\s*0*(\d{9})/i,
      /No\.\s*0*(\d{9})/i,
      /N\s*\.?\s*0*(\d{9})/i
    ];

    for (const r of padroes) {
      const m = t.match(r);
      if (m) return m[1].padStart(9, '0');
    }

    const fallback = t.match(/\b\d{9}\b/);
    return fallback ? fallback[0] : null;
  }

  function extrairItens(texto) {
    const t = String(texto || '').replace(/\s+/g, ' ').trim();
    const itens = [];

    // Captura linhas de produto no padrão DANFE:
    // CODIGO(8) + DESCRICAO + NCM(8) + CST(3) + CFOP(4) + UN
    const re = /(\d{8})\s+(.+?)\s+(\d{8})\s+\d{3}\s+\d{4}\s+[A-Z]{2,4}\s+/g;
    let m;

    while ((m = re.exec(t)) !== null) {
      const cod = m[1];
      const descricao = m[2]
        .replace(/\*+/g, '')
        .replace(/\s+/g, ' ')
        .trim();

      if (!cod || !descricao) continue;
      if (itens.some(i => i.cod === cod && i.descricao === descricao)) continue;

      itens.push({ cod, descricao });
    }

    return itens;
  }

  function montarTabela(itens, nfe) {
    const tbody = document.getElementById('tbodyItens');
    tbody.innerHTML = '';

    itens.forEach((item, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.cod}</td>
        <td>${item.descricao}</td>
        <td><input type="number" min="0" step="1" value="0" data-idx="${idx}" class="inp-palete" /></td>
      `;
      tbody.appendChild(tr);
    });

    document.querySelectorAll('.inp-palete').forEach(inp => {
      inp.addEventListener('input', atualizarTotalPaletes);
    });

    document.getElementById('kpiNfe').textContent = nfe;
    document.getElementById('kpiItens').textContent = String(itens.length);
    document.getElementById('dataImpressao').textContent = 'Gerado em ' + new Date().toLocaleString('pt-BR');
    atualizarTotalPaletes();

    document.getElementById('resultado').style.display = 'block';
  }

  function atualizarTotalPaletes() {
    const total = Array.from(document.querySelectorAll('.inp-palete'))
      .reduce((acc, el) => acc + (Number(el.value) || 0), 0);
    document.getElementById('kpiPaletes').textContent = String(total);
  }

  function somenteDigitos(v) {
    return String(v || '').replace(/\D/g, '');
  }

  function mostrarErro(msg) {
    const e = document.getElementById('erro');
    e.style.display = 'block';
    e.textContent = msg;
  }

  function limparErro() {
    const e = document.getElementById('erro');
    e.style.display = 'none';
    e.textContent = '';
  }
</script>
</body>
</html>
