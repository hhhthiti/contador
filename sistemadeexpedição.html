<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Analisador de Cargas Inteligente</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #e9ecef; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        textarea { width: 100%; height: 200px; border: 2px solid #ddd; border-radius: 8px; padding: 15px; font-family: monospace; }
        button { background: #007bff; color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; width: 100%; }
        button:hover { background: #0056b3; }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        canvas { background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #eee; }
        h2 { color: #333; margin-top: 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Logística: Processamento de DTs</h2>
    <p>Cole os dados abaixo (aceita formato lista ou tabela do Excel):</p>
    <textarea id="dadosInput" placeholder="Cole aqui as colunas ou a lista vertical..."></textarea>
    <button onclick="processar()">Gerar Dashboard</button>

    <div class="charts">
        <canvas id="chartPodio"></canvas>
        <canvas id="chartCargas"></canvas>
    </div>
</div>

<script>
let chartPodio, chartCargas;

function processar() {
    const rawText = document.getElementById('dadosInput').value;
    // Limpa linhas vazias e remove o cabeçalho se existir
    const linhas = rawText.split('\n').map(l => l.trim()).filter(l => l !== "" && !l.includes("DT") && !l.includes("CONFERENTE"));
    
    let scores = {};
    let tipos = { 'Paletizada': 0, 'Granel': 0 };

    // Lógica para leitura vertical (3 em 3 linhas: DT, Carga, Nome)
    for (let i = 0; i < linhas.length; i += 3) {
        if (!linhas[i+1] || !linhas[i+2]) break;

        const cargaRaw = linhas[i+1].toUpperCase();
        const conferenteRaw = linhas[i+2].toUpperCase().replace(/\./g, ''); // Remove pontos (ex: Felipe.)

        // Identificação inteligente de carga (P = Paletizada, G = Granel)
        if (cargaRaw.startsWith('P')) tipos['Paletizada']++;
        else if (cargaRaw.startsWith('G')) tipos['Granel']++;

        // Divisão de conferentes (Bruno/Emerson ou Bruno/Buno)
        const nomes = conferenteRaw.split(/[\/|-]/);
        const pesoPorPessoa = 1 / nomes.length;

        nomes.forEach(nome => {
            const n = nome.trim();
            if (n) {
                scores[n] = (scores[n] || 0) + pesoPorPessoa;
            }
        });
    }

    renderizar(scores, tipos);
}

function renderizar(scores, tipos) {
    const labels = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
    const data = labels.map(l => scores[l].toFixed(1));

    if (chartPodio) chartPodio.destroy();
    if (chartCargas) chartCargas.destroy();

    // Gráfico de Pódio
    chartPodio = new Chart(document.getElementById('chartPodio'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Cargas Conferidas (Peso Total)',
                data: data,
                backgroundColor: '#007bff',
                borderRadius: 5
            }]
        },
        options: { 
            indexAxis: 'y', 
            plugins: { title: { display: true, text: 'RANKING DE CONFERENTES (PÓDIO)' } } 
        }
    });

    // Gráfico de Pizza
    chartCargas = new Chart(document.getElementById('chartCargas'), {
        type: 'doughnut',
        data: {
            labels: ['Paletizada', 'Granel'],
            datasets: [{
                data: [tipos['Paletizada'], tipos['Granel']],
                backgroundColor: ['#28a745', '#ffc107']
            }]
        },
        options: { 
            plugins: { title: { display: true, text: 'DISTRIBUIÇÃO POR TIPO DE CARGA' } } 
        }
    });
}
</script>

</body>
</html>
