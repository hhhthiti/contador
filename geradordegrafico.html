<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Cargas - Versão Blindada</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 700px; }
        .upload-area { border: 2px dashed #007bff; background: #f8f9ff; padding: 20px; border-radius: 10px; text-align: center; cursor: pointer; margin-bottom: 10px; }
        textarea { width: 100%; height: 150px; margin: 10px 0; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-family: monospace; }
        .btns { display: flex; gap: 10px; justify-content: center; }
        button { border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; }
        .btn-green { background: #28a745; }
        .btn-blue { background: #007bff; }
        #relatorio { background: white; padding: 20px; border-radius: 10px; margin-top: 20px; width: 100%; max-width: 700px; display: none; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #eee; padding: 8px; text-align: left; font-size: 13px; }
        th { background: #f8f9fa; }
        .resumo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { padding: 15px; border-radius: 8px; color: white; }
        .estivada { background: #28a745; }
        .paletizada { background: #17a2b8; }
        .total { background: #343a40; grid-column: span 2; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center">🚚 Sistema de Cargas</h2>
    
    <div class="upload-area" onclick="document.getElementById('fotoInput').click()">
        <strong>📸 Clique para Tirar Foto ou Subir Imagem</strong>
        <input type="file" id="fotoInput" accept="image/*" style="display:none">
        <div id="status" style="color: #007bff; margin-top: 10px; font-weight: bold;"></div>
    </div>

    <textarea id="inputDados" placeholder="Os dados da foto aparecerão aqui..."></textarea>

    <div class="btns">
        <button class="btn-green" onclick="processarDados()">📊 Gerar Relatório</button>
        <button id="btnExport" class="btn-blue" onclick="exportarFoto()" style="display:none">📲 Salvar Foto WhatsApp</button>
    </div>
</div>

<div id="relatorio">
    <h3 style="text-align: center;">Resumo Diário de Carregamento</h3>
    <div id="tabelaResultado"></div>
    <div class="resumo-grid">
        <div class="card estivada" id="cardE"></div>
        <div class="card paletizada" id="cardP"></div>
        <div class="card total" id="cardT"></div>
    </div>
    <canvas id="graficoCargas" style="margin-top:20px;"></canvas>
</div>

<script>
let meuGrafico = null;

document.getElementById('fotoInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const status = document.getElementById('status');
    status.innerText = "⏳ Lendo foto... aguarde.";
    
    Tesseract.recognize(file, 'por').then(({ data: { text } }) => {
        document.getElementById('inputDados').value = text;
        status.innerText = "✅ Leitura concluída!";
    });
});

function limparEConverterPeso(texto) {
    if (!texto) return 0;
    // Remove tudo que não for número, vírgula ou ponto
    let limpo = texto.replace(/[^\d.,]/g, '');
    
    // Se tiver vírgula e ponto (ex: 8.539,09), remove o ponto e troca vírgula por ponto
    if (limpo.includes(',') && limpo.includes('.')) {
        limpo = limpo.replace(/\./g, '').replace(',', '.');
    } else {
        limpo = limpo.replace(',', '.');
    }

    let valor = parseFloat(limpo);
    
    // TRUQUE PARA FOTOS: Se o peso vier sem vírgula (ex: 223075 em vez de 2230.75)
    // Se o valor for maior que 50.000 (muito pesado para um carro comum), dividimos por 100
    if (valor > 50000 && !texto.includes(',') && !texto.includes('.')) {
        valor = valor / 100;
    }
    
    return valor || 0;
}

function processarDados() {
    const texto = document.getElementById('inputDados').value.trim();
    const linhas = texto.split('\n');
    let dados = { estivada: { qtd: 0, peso: 0 }, paletizada: { qtd: 0, peso: 0 } };
    let htmlTabela = '<table><tr><th>DT</th><th>Tipo</th><th>Peso (KG)</th></tr>';
    let temDados = false;

    linhas.forEach(linha => {
        let l = linha.toUpperCase();
        if (l.includes("SOMA") || l.length < 5) return;

        // Tenta pegar os blocos de texto da linha
        let partes = l.split(/\s+/).filter(p => p.length > 2);
        if (partes.length < 2) return;

        let dt = partes[0];
        let peso = limparEConverterPeso(partes[partes.length - 1]);
        
        // Identifica o tipo mesmo com erro de leitura (ex: "paErnZADA")
        let tipo = "PALETIZADA";
        if (l.includes("ESTIV") || l.includes("ESTIW") || l.includes("ESTV")) {
            tipo = "ESTIVADA";
        }

        if (peso > 0) {
            htmlTabela += `<tr><td>${dt}</td><td>${tipo}</td><td>${peso.toLocaleString('pt-BR', {minimumFractionDigits:2})}</td></tr>`;
            if (tipo === "ESTIVADA") {
                dados.estivada.qtd++;
                dados.estivada.peso += peso;
            } else {
                dados.paletizada.qtd++;
                dados.paletizada.peso += peso;
            }
            temDados = true;
        }
    });

    if (!temDados) return alert("Não consegui ler os números. Verifique o texto e tente novamente.");

    document.getElementById('tabelaResultado').innerHTML = htmlTabela + '</table>';
    document.getElementById('cardE').innerHTML = `<b>ESTIVADA</b><br>${dados.estivada.qtd} carros<br>${dados.estivada.peso.toLocaleString('pt-BR')} kg`;
    document.getElementById('cardP').innerHTML = `<b>PALETIZADA</b><br>${dados.paletizada.qtd} carros<br>${dados.paletizada.peso.toLocaleString('pt-BR')} kg`;
    
    let totalPeso = dados.estivada.peso + dados.paletizada.peso;
    document.getElementById('cardT').innerHTML = `<b>TOTAL GERAL</b><br>${dados.estivada.qtd + dados.paletizada.qtd} Carros | ${(totalPeso/1000).toFixed(2)} Toneladas`;

    renderizarGrafico(dados);
    document.getElementById('relatorio').style.display = 'block';
    document.getElementById('btnExport').style.display = 'inline-block';
}

function renderizarGrafico(dados) {
    const ctx = document.getElementById('graficoCargas').getContext('2d');
    if (meuGrafico) meuGrafico.destroy();
    meuGrafico = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Estivada', 'Paletizada'],
            datasets: [{
                label: 'Peso (KG)',
                data: [dados.estivada.peso, dados.paletizada.peso],
                backgroundColor: ['#28a745', '#17a2b8']
            }]
        }
    });
}

function exportarFoto() {
    html2canvas(document.getElementById('relatorio')).then(canvas => {
        const link = document.createElement('a');
        link.download = 'relatorio_entrega.png';
        link.href = canvas.toDataURL();
        link.click();
    });
}
</script>
</body>
</html>
