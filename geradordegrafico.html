<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cargas Profissional</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 800px; }
        .header { text-align: center; border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 10px; }
        
        .upload-area { border: 2px dashed #007bff; background: #f8f9ff; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; cursor: pointer; }
        textarea { width: 100%; height: 150px; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 13px; background: #fff; margin: 10px 0; }
        
        .btns { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        button { border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-success { background: #28a745; color: white; }
        .btn-primary { background: #007bff; color: white; }
        button:disabled { background: #ccc; }

        #relatorio { background: white; padding: 30px; border-radius: 10px; margin-top: 25px; width: 100%; box-sizing: border-box; border: 1px solid #e0e0e0; display: none; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #f0f0f0; padding: 12px; text-align: left; }
        th { background: #f8f9fa; color: #555; }

        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { padding: 20px; border-radius: 8px; color: white; text-align: center; }
        .card-blue { background: #17a2b8; }
        .card-green { background: #28a745; }
        .card-dark { background: #343a40; grid-column: 1 / -1; }
        
        .status-msg { font-size: 14px; font-weight: bold; margin-top: 10px; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🚚 Gerador de Relatório de Carga</h2>
        <p>Tire foto do papel/tela ou cole do Excel</p>
    </div>

    <div class="upload-area" onclick="document.getElementById('fotoInput').click()">
        <strong>📸 Clique aqui para subir uma FOTO</strong>
        <input type="file" id="fotoInput" accept="image/*" style="display:none">
        <div id="status" class="status-msg"></div>
    </div>

    <p style="font-size: 12px; color: #666; margin-bottom: 5px;">Texto identificado (Confira e corrija se necessário):</p>
    <textarea id="inputDados" placeholder="Os dados aparecerão aqui..."></textarea>

    <div class="btns">
        <button id="btnGerar" class="btn-success" onclick="processarDados()">📊 Gerar Relatório</button>
        <button id="btnExport" class="btn-primary" onclick="exportarFoto()" style="display:none">📲 Baixar Foto para WhatsApp</button>
    </div>
</div>

<div id="relatorio">
    <h3 style="text-align: center; margin-top: 0;">Resumo de Carregamento Diário</h3>
    <div id="tabelaResultado"></div>
    
    <div class="cards">
        <div class="card card-green" id="resumoEstivada"></div>
        <div class="card card-blue" id="resumoPaletizada"></div>
        <div class="card card-dark" id="resumoTotal"></div>
    </div>

    <canvas id="graficoCargas" height="150"></canvas>
</div>

<script>
let meuGrafico = null;

// Lógica de Leitura de Foto
document.getElementById('fotoInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const status = document.getElementById('status');
    status.innerText = "⏳ Lendo imagem... Isso leva uns 10 segundos.";
    document.getElementById('btnGerar').disabled = true;

    Tesseract.recognize(file, 'por', { logger: m => console.log(m) }).then(({ data: { text } }) => {
        // Limpeza básica do texto reconhecido
        let textoLimpo = text.replace(/[|\[\]\(\)]/g, ' '); 
        document.getElementById('inputDados').value = textoLimpo;
        status.innerText = "✅ Concluído! Verifique o texto abaixo.";
        document.getElementById('btnGerar').disabled = false;
    });
});

function processarDados() {
    const texto = document.getElementById('inputDados').value.trim();
    if (!texto) return alert("Por favor, insira ou leia os dados primeiro.");

    const linhas = texto.split('\n');
    let dados = { estivada: { qtd: 0, peso: 0 }, paletizada: { qtd: 0, peso: 0 } };
    let htmlTabela = '<table><thead><tr><th>DT / Identificação</th><th>Tipo</th><th>Peso (KG)</th></tr></thead><tbody>';
    let temDados = false;

    linhas.forEach(linha => {
        let l = linha.toUpperCase();
        if (l.includes("SOMA") || l.trim().length < 5) return;

        // Tenta extrair o peso (procura por números com vírgula ou pontos)
        let numeros = l.match(/\d+[\.,]\d+/g) || l.match(/\d+/g);
        if (!numeros) return;

        let peso = 0;
        let dt = numeros[0]; // Assume que o primeiro número longo é a DT

        // Se houver mais de um número, o último geralmente é o peso
        if (numeros.length >= 2) {
            let pStr = numeros[numeros.length - 1].replace(/\./g, '').replace(',', '.');
            peso = parseFloat(pStr) || 0;
        }

        let tipo = l.includes("ESTIV") ? "ESTIVADA" : "PALETIZADA";

        if (peso > 0) {
            htmlTabela += `<tr><td>${dt}</td><td>${tipo}</td><td>${peso.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td></tr>`;
            if (tipo === "ESTIVADA") {
                dados.estivada.qtd++;
                dados.estivada.peso += peso;
            } else {
                dados.paletizada.qtd++;
                dados.paletizada.peso += peso;
            }
            temDados = true;
        }
    });

    if (!temDados) return alert("Não consegui extrair valores. Tente ajustar o texto manualmente.");

    document.getElementById('tabelaResultado').innerHTML = htmlTabela + '</tbody></table>';
    document.getElementById('resumoEstivada').innerHTML = `<b>🚛 ESTIVADA</b><br>${dados.estivada.qtd} carros<br>${dados.estivada.peso.toLocaleString('pt-BR')} kg`;
    document.getElementById('resumoPaletizada').innerHTML = `<b>📦 PALETIZADA</b><br>${dados.paletizada.qtd} carros<br>${dados.paletizada.peso.toLocaleString('pt-BR')} kg`;
    
    let totalPeso = dados.estivada.peso + dados.paletizada.peso;
    document.getElementById('resumoTotal').innerHTML = `<b>📊 TOTAL GERAL</b><br>${dados.estivada.qtd + dados.paletizada.qtd} Carros carregados | ${(totalPeso/1000).toFixed(2)} Toneladas`;

    gerarGrafico(dados);
    document.getElementById('relatorio').style.display = 'block';
    document.getElementById('btnExport').style.display = 'inline-block';
    window.scrollTo(0, document.body.scrollHeight);
}

function gerarGrafico(dados) {
    const ctx = document.getElementById('graficoCargas').getContext('2d');
    if (meuGrafico) meuGrafico.destroy();
    meuGrafico = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Estivada (kg)', 'Paletizada (kg)'],
            datasets: [{
                data: [dados.estivada.peso, dados.paletizada.peso],
                backgroundColor: ['#28a745', '#17a2b8'],
                hoverOffset: 4
            }]
        },
        options: { plugins: { legend: { position: 'bottom' } } }
    });
}

function exportarFoto() {
    const alvo = document.getElementById('relatorio');
    html2canvas(alvo, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'Relatorio_Carga.png';
        link.href = canvas.toDataURL("image/png");
        link.click();
    });
}
</script>
</body>
</html>
