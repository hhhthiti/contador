<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fechamento de Cargas JSL</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 700px; }
        textarea { width: 100%; height: 150px; margin: 15px 0; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-family: monospace; box-sizing: border-box; }
        .btns { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        button { border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .btn-green { background: #28a745; }
        .btn-blue { background: #0056b3; }
        button:hover { opacity: 0.8; }

        #relatorio { background: white; padding: 30px; border-radius: 5px; margin-top: 20px; width: 100%; max-width: 800px; display: none; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .header-relatorio { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th { background: #343a40; color: white; padding: 10px; font-size: 13px; }
        td { border: 1px solid #dee2e6; padding: 8px; text-align: center; font-size: 14px; }
        tr:nth-child(even) { background-color: #f8f9fa; }

        .resumo-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card { padding: 15px; border-radius: 8px; color: white; text-align: center; font-weight: bold; }
        .paletizada { background: #17a2b8; }
        .granel { background: #28a745; }
        .total-card { background: #ed1c24; }
        
        .chart-box { max-width: 400px; margin: 0 auto; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color: #ed1c24;">📊 Fechamento de Cargas</h2>
    
    <textarea id="inputDados" placeholder="Cole os dados aqui (DT TIPO PESO)"></textarea>

    <div class="btns">
        <button class="btn-green" onclick="processarDados()">📊 Gerar Relatório</button>
        <button id="btnExport" class="btn-blue" onclick="exportarFoto()" style="display:none">📸 Salvar Imagem</button>
    </div>
</div>

<div id="relatorio">
    <div class="header-relatorio">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b0/JSL_Logo.png/640px-JSL_Logo.png" height="50">
        <div style="text-align: right;">
            <h3 style="margin:0; color: #ed1c24;">RESUMO DE EXPEDIÇÃO</h3>
            <small id="dataAtual"></small>
        </div>
    </div>

    <div class="resumo-grid">
        <div class="card paletizada" id="cardP"></div>
        <div class="card granel" id="cardG"></div>
        <div class="card total-card" id="cardT"></div>
    </div>

    <div id="tabelaResultado"></div>

    <div class="chart-box">
        <canvas id="graficoOperacao"></canvas>
    </div>
</div>

<script>
let meuGrafico = null;
document.getElementById('dataAtual').innerText = new Date().toLocaleDateString('pt-BR');

function extrairPeso(texto) {
    let partes = texto.trim().split(/\s+/);
    let ultimo = partes[partes.length - 1].replace(/[^\d]/g, '');
    return parseFloat(ultimo) || 0;
}

function processarDados() {
    const texto = document.getElementById('inputDados').value.trim();
    if (!texto) return alert("Insira os dados primeiro!");
    
    const linhas = texto.split('\n');
    let cargas = [];
    let resumo = { paletizada: { qtd: 0, peso: 0 }, granel: { qtd: 0, peso: 0 } };

    linhas.forEach(linha => {
        let l = linha.toUpperCase().trim();
        if (l.length < 5) return;

        let partes = l.split(/\s+/);
        let dt = partes[0];
        let pesoKg = extrairPeso(l);
        let tipo = l.includes("PAL") ? "PALETIZADA" : "GRANEL";
        
        cargas.push({ dt, tipo, peso: pesoKg });

        if (tipo === "PALETIZADA") {
            resumo.paletizada.qtd++;
            resumo.paletizada.peso += pesoKg;
        } else {
            resumo.granel.qtd++;
            resumo.granel.peso += pesoKg;
        }
    });

    cargas.sort((a, b) => a.tipo.localeCompare(b.tipo) * -1);

    let html = '<table><thead><tr><th>Nº DT</th><th>TIPO</th><th>TONELADAS (TON)</th></tr></thead><tbody>';
    cargas.forEach(c => {
        html += `<tr>
            <td>${c.dt}</td>
            <td><b>${c.tipo}</b></td>
            <td>${(c.peso/1000).toFixed(2)}</td>
        </tr>`;
    });
    document.getElementById('tabelaResultado').innerHTML = html + '</tbody></table>';

    // CÁLCULOS DOS TOTAIS
    let tonP = resumo.paletizada.peso / 1000;
    let tonG = resumo.granel.peso / 1000;
    let totalCargas = resumo.paletizada.qtd + resumo.granel.qtd;
    let totalToneladas = tonP + tonG;

    // ATUALIZAÇÃO DOS CARDS
    document.getElementById('cardP').innerHTML = `PALETIZADA<br>${resumo.paletizada.qtd} Carros<br>${tonP.toFixed(1)} Ton`;
    document.getElementById('cardG').innerHTML = `GRANEL<br>${resumo.granel.qtd} Carros<br>${tonG.toFixed(1)} Ton`;
    document.getElementById('cardT').innerHTML = `TOTAL GERAL<br>${totalCargas} Veículos<br>${totalToneladas.toFixed(1)} Ton`;

    renderizarGrafico(resumo);
    document.getElementById('relatorio').style.display = 'block';
    document.getElementById('btnExport').style.display = 'inline-block';
}

function renderizarGrafico(resumo) {
    const ctx = document.getElementById('graficoOperacao').getContext('2d');
    if (meuGrafico) meuGrafico.destroy();
    
    meuGrafico = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Paletizada', 'Granel'],
            datasets: [{
                label: 'Toneladas',
                data: [(resumo.paletizada.peso/1000), (resumo.granel.peso/1000)],
                backgroundColor: ['#17a2b8', '#28a745'],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: { y: { beginAtZero: true } },
            plugins: { legend: { display: false } }
        }
    });
}

function exportarFoto() {
    html2canvas(document.getElementById('relatorio'), { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Relatorio_JSL.png`;
        link.href = canvas.toDataURL();
        link.click();
    });
}
</script>
</body>
</html>
