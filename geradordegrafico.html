<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relatório de Cargas</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #tabela { margin-top: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
  </style>
</head>
<body>
  <h2>Upload da foto da folha</h2>
  <input type="file" id="upload" accept="image/*"><br><br>
  <button onclick="processar()">Gerar Relatório</button>

  <div id="tabela"></div>
  <canvas id="grafico"></canvas>
  <button onclick="exportar()">Exportar como Imagem</button>

  <script>
    let resumoGlobal = null;

    async function processar() {
      const file = document.getElementById("upload").files[0];
      if (!file) { alert("Selecione uma imagem primeiro!"); return; }

      const { data: { text } } = await Tesseract.recognize(file, 'por');
      const linhas = text.trim().split("\n");
      let dados = [];
      let totalPalet = 0, totalEstiva = 0, qtdPalet = 0, qtdEstiva = 0;

      linhas.forEach(l => {
        const partes = l.split(/[\s;,\t]+/); // aceita ; ou espaço
        if (partes.length >= 3) {
          const dt = partes[0];
          const carga = partes[1].toUpperCase();
          const kg = parseFloat(partes[2]);
          if (!isNaN(kg)) {
            dados.push({dt, carga, kg});
            if (carga.includes("PALET")) { qtdPalet++; totalPalet += kg; }
            else if (carga.includes("ESTIV")) { qtdEstiva++; totalEstiva += kg; }
          }
        }
      });

      // Tabela
      let html = "<table><tr><th>DT</th><th>CARGA</th><th>KG</th></tr>";
      dados.forEach(d => {
        html += `<tr><td>${d.dt}</td><td>${d.carga}</td><td>${d.kg}</td></tr>`;
      });
      html += "</table>";
      html += `<p>Carros Paletizados: ${qtdPalet} | Peso: ${totalPalet} kg</p>`;
      html += `<p>Carros Estivados: ${qtdEstiva} | Peso: ${totalEstiva} kg</p>`;
      html += `<p>Total: ${qtdPalet+qtdEstiva} carros | ${(totalPalet+totalEstiva)/1000} toneladas</p>`;
      document.getElementById("tabela").innerHTML = html;

      resumoGlobal = {totalPalet, totalEstiva};
      gerarGrafico(totalPalet, totalEstiva);
    }

    function gerarGrafico(totalPalet, totalEstiva) {
      new Chart(document.getElementById("grafico"), {
        type: 'bar',
        data: {
          labels: ['Paletizados', 'Estivados'],
          datasets: [{
            label: 'Peso (kg)',
            data: [totalPalet, totalEstiva],
            backgroundColor: ['blue','green']
          }]
        }
      });
    }

    function exportar() {
      const canvas = document.getElementById("grafico");
      const img = canvas.toDataURL("image/png");
      const link = document.createElement("a");
      link.href = img;
      link.download = "relatorio.png";
      link.click();
    }
  </script>
</body>
</html>
