<script>
let graficoInstancia = null;

document.getElementById('input-excel').addEventListener('change', function(e) {
    const log = document.getElementById('log');
    log.innerHTML = "Processando turno (22h - 06h)...";
    
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            // Usamos raw: false para o SheetJS tentar formatar as datas automaticamente
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, {header: "A", raw: false});
            
            processarDTS(rows);
            log.innerHTML = "<span style='color:green'>Filtro de Turno Aplicado com Sucesso!</span>";
        } catch (err) {
            log.innerHTML = "Erro: " + err;
        }
    };
    reader.readAsArrayBuffer(file);
});

function converterDataExcel(valor) {
    if (!valor) return null;
    // Tenta converter o formato comum de data do Excel ou texto para objeto Date do JS
    const d = new Date(valor);
    return isNaN(d.getTime()) ? null : d;
}

function processarDTS(rows) {
    const tbody = document.querySelector('#tabela-dados tbody');
    tbody.innerHTML = "";
    
    let stats = {
        paletizada: { qtd: 0, peso: 0 },
        estivada: { qtd: 0, peso: 0 }
    };

    // --- DEFINIÇÃO DO PERÍODO DO TURNO ---
    const agora = new Date();
    const dataHoje = agora.toLocaleDateString('en-CA'); // YYYY-MM-DD
    
    const inicioTurno = new Date();
    inicioTurno.setDate(agora.getDate() - 1);
    inicioTurno.setHours(22, 0, 0); // Ontem às 22:00

    const fimTurno = new Date();
    fimTurno.setHours(6, 0, 0);    // Hoje às 06:00
    // -------------------------------------

    const statusPermitidos = ["Operação Abandonada", "NF Emitida", "Finalizado", "Faturamento Iniciado", "Descarga Concluída", "Carregamento Concluído"];

    rows.forEach((r, index) => {
        if(index === 0) return;

        // 1. FILTRO DE HORÁRIO (Coluna Q - Autorização de Encosta)
        const dataEncosta = converterDataExcel(r.Q);
        if (!dataEncosta || dataEncosta < inicioTurno || dataEncosta > fimTurno) return;

        // 2. FILTRO DE SEGMENTO (Coluna D)
        if (String(r.D).toUpperCase() !== "BC") return;

        // 3. FILTRO DE STATUS (Coluna N)
        if (!statusPermitidos.includes(String(r.N).trim())) return;

        // --- SE PASSOU PELOS FILTROS, PROCESSA ---
        const peso = parseFloat(String(r.L).replace('.', '').replace(',', '.')) || 0;
        const dt = r.J || "N/A";
        
        // Critério: Se a coluna B contiver "PALET" é paletizada, senão é estivada
        const tipoCarga = String(r.B).toUpperCase().includes("PALET") ? "PALETIZADA" : "ESTIVADA";

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="col-0">${dt}</td>
            <td class="col-1">${tipoCarga}</td>
            <td class="col-2">${peso.toLocaleString('pt-BR')} kg</td>
            <td class="col-3">${r.N}</td>
            <td class="col-4">${r.V ? '✅ ' + r.V : '-'}</td>
            <td class="col-5">${r.AA || '-'}</td>
            <td class="col-6">${r.O || '-'}</td>
        `;
        tbody.appendChild(tr);

        if(tipoCarga === "PALETIZADA") {
            stats.paletizada.qtd++;
            stats.paletizada.weight += peso; // Note: usei weight para não confundir, mas corrigindo abaixo
            stats.paletizada.peso += peso;
        } else {
            stats.estivada.qtd++;
            stats.estivada.peso += peso;
        }
    });

    document.getElementById('configuracoes').style.display = 'block';
    document.getElementById('grafico-container').style.display = 'block';
    document.getElementById('tabela-container').style.display = 'block';
    atualizarGrafico(stats);
}

function atualizarGrafico(stats) {
    const ctx = document.getElementById('meuGrafico').getContext('2d');
    if(graficoInstancia) graficoInstancia.destroy();

    const totalQtd = stats.paletizada.qtd + stats.estivada.qtd;
    const totalPeso = (stats.paletizada.peso + stats.estivada.peso).toLocaleString('pt-BR');

    graficoInstancia = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Paletizada', 'Estivada'],
            datasets: [{
                label: 'Qtd DTs',
                data: [stats.paletizada.qtd, stats.estivada.qtd],
                backgroundColor: '#007bff'
            }]
        },
        options: {
            plugins: {
                title: {
                    display: true,
                    text: `Total de DTs: ${totalQtd} | Peso Total: ${totalPeso} kg`
                }
            }
        }
    });
}
// Mantenha a função exportarPNG() igual à anterior
</script>
