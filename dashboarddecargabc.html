<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Processador de Carga BC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eceff1; padding: 20px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-export { background: #28a745; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #dee2e6; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; color: #495057; }
        #log { color: red; font-weight: bold; margin-top: 10px; }
        .controles-colunas { display: flex; gap: 15px; flex-wrap: wrap; margin: 15px 0; padding: 10px; border: 1px dashed #ccc; }
    </style>
</head>
<body>

<div class="card">
    <h2>1. Upload da Planilha</h2>
    <input type="file" id="input-excel" accept=".xlsx, .xls, .csv" />
    <div id="log"></div>
</div>

<div id="configuracoes" class="card" style="display:none;">
    <h2>2. Filtros e Colunas Visíveis</h2>
    <p>Escolha o que deseja ver no PNG final:</p>
    <div class="controles-colunas">
        <label><input type="checkbox" class="col-toggle" data-col="0" checked> DT (Doc)</label>
        <label><input type="checkbox" class="col-toggle" data-col="1" checked> Tipo Carga</label>
        <label><input type="checkbox" class="col-toggle" data-col="2" checked> Peso</label>
        <label><input type="checkbox" class="col-toggle" data-col="3" checked> Status</label>
        <label><input type="checkbox" class="col-toggle" data-col="4" checked> NF Solic.</label>
        <label><input type="checkbox" class="col-toggle" data-col="5" checked> Doca</label>
        <label><input type="checkbox" class="col-toggle" data-col="6" checked> Tempo Etapa</label>
    </div>
    <button class="btn btn-export" onclick="exportarPNG()">Gerar e Baixar PNG</button>
</div>

<div id="area-impressao">
    <div class="card" id="grafico-container" style="display:none;">
        <canvas id="meuGrafico" style="max-height: 300px;"></canvas>
    </div>

    <div class="card" id="tabela-container" style="display:none;">
        <table id="tabela-dados">
            <thead>
                <tr>
                    <th class="col-0">DT (Doc)</th>
                    <th class="col-1">Tipo Carga</th>
                    <th class="col-2">Peso</th>
                    <th class="col-3">Status</th>
                    <th class="col-4">NF Solic.</th>
                    <th class="col-5">Doca</th>
                    <th class="col-6">Tempo Etapa</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
let graficoInstancia = null;

document.getElementById('input-excel').addEventListener('change', function(e) {
    const log = document.getElementById('log');
    log.innerHTML = "Processando...";
    
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array', cellDates: true});
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            // Convertemos para matriz (A=0, B=1, C=2...)
            const rows = XLSX.utils.sheet_to_json(firstSheet, {header: "A", raw: false});
            
            if(rows.length === 0) throw "A planilha parece estar vazia.";
            
            processarDTS(rows);
            log.innerHTML = "<span style='color:green'>Sucesso! " + (rows.length - 1) + " linhas lidas.</span>";
        } catch (err) {
            log.innerHTML = "Erro: " + err;
            console.error(err);
        }
    };
    reader.readAsArrayBuffer(file);
});

function processarDTS(rows) {
    const tbody = document.querySelector('#tabela-dados tbody');
    tbody.innerHTML = "";
    
    let stats = {
        paletizada: { qtd: 0, peso: 0 },
        estivada: { qtd: 0, peso: 0 }
    };

    // Definição de Status Permitidos
    const statusPermitidos = ["Operação Abandonada", "NF Emitida", "Finalizado", "Faturamento Iniciado", "Descarga Concluída", "Carregamento Concluído"];

    rows.forEach((r, index) => {
        if(index === 0) return; // Pula cabeçalho

        // FILTRO 1: Segmento BC (Coluna D)
        if (String(r.D).toUpperCase() !== "BC") return;

        // FILTRO 2: Status (Coluna N)
        if (!statusPermitidos.includes(String(r.N).trim())) return;

        // Lógica de Peso (Coluna L) e DT (Coluna J)
        const pesoRaw = String(r.L).replace(',', '.');
        const peso = parseFloat(pesoRaw) || 0;
        const dt = r.J || "N/A";
        
        // Simulação de busca Paletizada/Estivada (Baseado na Coluna B do arquivo)
        const tipoCarga = String(r.B).toUpperCase().includes("PALET") ? "PALETIZADA" : "ESTIVADA";

        // Preencher Tabela
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="col-0">${dt}</td>
            <td class="col-1">${tipoCarga}</td>
            <td class="col-2">${peso.toLocaleString('pt-BR')}</td>
            <td class="col-3">${r.N || ''}</td>
            <td class="col-4">${r.V ? '✅ ' + r.V : '-'}</td>
            <td class="col-5">${r.AA || '-'}</td>
            <td class="col-6">${r.O || '-'}</td>
        `;
        tbody.appendChild(tr);

        // Acumular Stats
        if(tipoCarga === "PALETIZADA") {
            stats.paletizada.qtd++;
            stats.paletizada.peso += peso;
        } else {
            stats.estivada.qtd++;
            stats.estivada.peso += peso;
        }
    });

    // Mostrar áreas e atualizar componentes
    document.getElementById('configuracoes').style.display = 'block';
    document.getElementById('grafico-container').style.display = 'block';
    document.getElementById('tabela-container').style.display = 'block';
    atualizarGrafico(stats);
}

function atualizarGrafico(stats) {
    const ctx = document.getElementById('meuGrafico').getContext('2d');
    if(graficoInstancia) graficoInstancia.destroy();

    graficoInstancia = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Paletizada', 'Estivada', 'TOTAL'],
            datasets: [{
                label: 'Quantidade de DTs',
                data: [stats.paletizada.qtd, stats.estivada.qtd, stats.paletizada.qtd + stats.estivada.qtd],
                backgroundColor: '#007bff'
            }, {
                label: 'Peso Total (Kg)',
                data: [stats.paletizada.peso, stats.estivada.peso, stats.paletizada.peso + stats.estivada.peso],
                backgroundColor: '#dc3545'
            }]
        }
    });
}

function exportarPNG() {
    // Esconder colunas não marcadas antes de tirar a foto
    document.querySelectorAll('.col-toggle').forEach(checkbox => {
        const colClass = '.col-' + checkbox.getAttribute('data-col');
        document.querySelectorAll(colClass).forEach(el => {
            el.style.display = checkbox.checked ? '' : 'none';
        });
    });

    const area = document.getElementById('area-impressao');
    html2canvas(area).then(canvas => {
        const link = document.createElement('a');
        link.download = 'Resumo_Carga_BC.png';
        link.href = canvas.toDataURL();
        link.click();
    });
}
</script>

</body>
</html>
