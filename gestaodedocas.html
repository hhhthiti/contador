<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Docas 1-11</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #004a99;
            --accent: #28a745;
            --bg: #e9ecef;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            margin: 0;
            padding: 20px; 
        }

        /* Menu Superior */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-menu {
            text-decoration: none;
            background: #6c757d;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-export {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-menu:hover { background: #495057; }
        .btn-export:hover { background: #218838; scale: 1.05; }

        /* Grade de Docas */
        #painel-docas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .doca {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            border: 1px solid #dee2e6;
        }

        .doca-header {
            background: var(--primary);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .doca-body { padding: 20px; }

        .campo { margin-bottom: 12px; }
        
        label { 
            font-size: 13px; 
            font-weight: 700; 
            color: #333; 
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus { border-color: var(--primary); }

        .conferente-input {
            background: #fff9db;
            border-color: #f1c40f;
            font-weight: bold;
        }

        @media print {
            .nav-bar { display: none; }
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="https://feraamentas.netlify.app" class="btn-menu">⬅ Voltar ao Menu</a>
        <h2 style="margin:0; color: var(--primary);">CONTROLE OPERACIONAL DE DOCAS</h2>
        <button class="btn-export" onclick="exportarImagem()">📸 Gerar Foto do Painel</button>
    </div>

    <div id="painel-docas">
        </div>

    <script>
        const painel = document.getElementById('painel-docas');

        for (let i = 1; i <= 11; i++) {
            const docaDiv = document.createElement('div');
            docaDiv.className = 'doca';
            
            let html = `<div class="doca-header">DOCA ${i}</div>`;
            html += `<div class="doca-body">
                        <div class="campo">
                            <label>⭐ Conferente Responsável</label>
                            <input type="text" class="conferente-input" placeholder="Nome Completo">
                        </div>
                        <label>👥 Equipe Auxiliar</label>`;
            
            for (let j = 1; j <= 6; j++) {
                html += `<div class="campo">
                            <input type="text" placeholder="Auxiliar ${j}">
                         </div>`;
            }
            
            html += `</div>`;
            docaDiv.innerHTML = html;
            painel.appendChild(docaDiv);
        }

        function exportarImagem() {
            const painelDocas = document.getElementById('painel-docas');
            // Removemos temporariamente o padding para a foto ficar justa
            html2canvas(painelDocas, {
                backgroundColor: "#e9ecef",
                scale: 2 // Aumenta a qualidade da foto
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Status_Docas_1-11.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
