<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Docas JSL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #d32f2f; /* Vermelho JSL */
            --secondary: #333;
            --bg: #ffffff;
        }

        body { 
            font-family: Arial, sans-serif; 
            margin: 0;
            padding: 0;
            background: #f4f4f4;
        }

        /* Menu fora da área da foto */
        .no-print-zone {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #fff;
            border-bottom: 2px solid #ddd;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .btn-menu { background: #666; color: white; }
        .btn-export { background: #28a745; color: white; }

        /* ÁREA DA FOTO (FORMATO PAISAGEM A4) */
        #area-captura {
            width: 1120px; /* Largura otimizada para paisagem */
            min-height: 790px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .header-foto {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .logo-jsl {
            height: 60px;
        }

        .titulo-foto {
            font-size: 28px;
            color: var(--secondary);
            font-weight: bold;
        }

        /* Grade das Docas - Organização Horizontal */
        .grade-docas {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 colunas para preencher bem */
            gap: 10px;
        }

        .doca {
            border: 2px solid #333;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
        }

        .doca-header {
            background: var(--primary);
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 5px;
            font-size: 18px;
        }

        .doca-content {
            padding: 8px;
        }

        .label-pequeno {
            font-size: 10px;
            font-weight: bold;
            color: #555;
            margin-bottom: 2px;
            display: block;
        }

        input {
            width: 100%;
            border: 1px solid #ccc;
            padding: 6px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 5px;
            border-radius: 3px;
        }

        .input-conferente {
            background: #fff9c4;
            border: 1.5px solid #fbc02d;
            font-weight: bold;
        }

        /* Ajuste específico para a última linha não ficar vazia */
        .doca:nth-child(n+9) {
            grid-column: span 1;
        }

    </style>
</head>
<body>

    <div class="no-print-zone">
        <a href="https://feraamentas.netlify.app" class="btn btn-menu">⬅ Voltar ao Menu</a>
        <button class="btn btn-export" onclick="exportarImagem()">📸 Gerar Imagem para Exportação</button>
    </div>

    <div id="area-captura">
        <div class="header-foto">
            <img src="icons/JSL.png" alt="JSL Logo" class="logo-jsl" onerror="this.style.display='none'">
            <div class="titulo-foto">EQUIPES OPERACIONAIS - DOCAS 01 A 11</div>
            <div id="data-atual" style="font-weight: bold;"></div>
        </div>

        <div class="grade-docas" id="container-docas">
            </div>
    </div>

    <script>
        // Setar data
        const d = new Date();
        document.getElementById('data-atual').innerText = d.toLocaleDateString();

        const container = document.getElementById('container-docas');

        // Gerar 11 Docas
        for (let i = 1; i <= 11; i++) {
            const docaNum = i < 10 ? '0' + i : i;
            const div = document.createElement('div');
            div.className = 'doca';
            
            let inputsAuxiliares = '';
            for (let j = 1; j <= 6; j++) {
                inputsAuxiliares += `<input type="text" placeholder="Auxiliar ${j}">`;
            }

            div.innerHTML = `
                <div class="doca-header">DOCA ${docaNum}</div>
                <div class="doca-content">
                    <span class="label-pequeno">CONFERENTE</span>
                    <input type="text" class="input-conferente" placeholder="Nome do Responsável">
                    <span class="label-pequeno">EQUIPE</span>
                    ${inputsAuxiliares}
                </div>
            `;
            container.appendChild(div);
        }

        function exportarImagem() {
            const captura = document.getElementById('area-captura');
            
            html2canvas(captura, {
                scale: 2, // Alta qualidade
                useCORS: true, // Permite carregar a imagem da logo se estiver em outro domínio
                logging: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `CONTRÔLE_DOCAS_${d.toLocaleDateString()}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
