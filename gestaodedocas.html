<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Docas JSL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #d32f2f; /* Vermelho JSL */
            --bg-doca: #fdfdfd;
        }

        body { 
            font-family: Arial, sans-serif; 
            margin: 0;
            padding: 0;
            background: #e5e5e5;
        }

        /* Menu de controle superior (Não sai na foto) */
        .no-print-zone {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #333;
            color: white;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }

        .btn-menu { background: #555; color: white; margin-right: 10px; }
        .btn-export { background: #28a745; color: white; }

        /* ÁREA DA FOTO (A4 PAISAGEM) */
        #area-captura {
            width: 1280px; /* Largura para preencher bem o formato horizontal */
            min-height: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            box-sizing: border-box;
        }

        .header-foto {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 5px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .logo-jsl { height: 70px; }

        .titulo-foto {
            font-size: 32px;
            color: #222;
            font-weight: 900;
        }

        /* Grade das Docas */
        .grade-docas {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* 6 colunas na linha de cima */
            gap: 12px;
        }

        /* Ajuste para a segunda linha (07 a 11) */
        .segunda-linha {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(6, 1fr); 
            gap: 12px;
        }

        .doca {
            border: 2px solid #000;
            background: var(--bg-doca);
            display: flex;
            flex-direction: column;
        }

        .doca-header {
            background: var(--primary);
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 8px;
            font-size: 20px;
            border-bottom: 2px solid #000;
        }

        .doca-content { padding: 10px; }

        .label-pequeno {
            font-size: 11px;
            font-weight: bold;
            color: #000;
            margin-bottom: 3px;
            display: block;
        }

        input {
            width: 100%;
            border: 1px solid #999;
            padding: 10px; /* Aumentado para melhor preenchimento manual */
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 6px;
            border-radius: 0; /* Estilo mais limpo para impressão */
            outline: none;
        }

        .input-conferente {
            background: #fff;
            border: 2px solid #000;
            margin-bottom: 12px;
        }

        .espaço-equipe {
            border-top: 1px dashed #ccc;
            padding-top: 8px;
        }

    </style>
</head>
<body>

    <div class="no-print-zone">
        <div>
            <a href="https://feraamentas.netlify.app" class="btn btn-menu">⬅ VOLTAR AO MENU</a>
        </div>
        <button class="btn btn-export" onclick="exportarImagem()">📸 GERAR IMAGEM PARA EXPORTAÇÃO</button>
    </div>

    <div id="area-captura">
        <div class="header-foto">
            <img src="icons/JSL.png" alt="JSL Logo" class="logo-jsl" onerror="this.src='https://via.placeholder.com/150x70?text=JSL+LOGO'">
            <div class="titulo-foto">EQUIPES OPERACIONAIS</div>
            <div id="data-atual" style="font-size: 20px; font-weight: bold;"></div>
        </div>

        <div class="grade-docas" id="linha-1"></div>

        <div class="segunda-linha" id="linha-2"></div>
    </div>

    <script>
        document.getElementById('data-atual').innerText = new Date().toLocaleDateString();

        function criarDoca(numero) {
            const numStr = numero < 10 ? '0' + numero : numero;
            const div = document.createElement('div');
            div.className = 'doca';
            
            let html = `
                <div class="doca-header">DOCA ${numStr}</div>
                <div class="doca-content">
                    <span class="label-pequeno">CONFERENTE:</span>
                    <input type="text" class="input-conferente">
                    
                    <span class="label-pequeno">EQUIPE AUXILIAR:</span>
                    <div class="espaço-equipe">
                        <input type="text">
                        <input type="text">
                        <input type="text">
                        <input type="text">
                        <input type="text">
                        <input type="text">
                    </div>
                </div>
            `;
            div.innerHTML = html;
            return div;
        }

        const linha1 = document.getElementById('linha-1');
        const linha2 = document.getElementById('linha-2');

        // Adiciona 01 a 06 na primeira linha
        for (let i = 1; i <= 6; i++) {
            linha1.appendChild(criarDoca(i));
        }

        // Adiciona 07 a 11 na segunda linha
        for (let i = 7; i <= 11; i++) {
            linha2.appendChild(criarDoca(i));
        }

        function exportarImagem() {
            const captura = document.getElementById('area-captura');
            html2canvas(captura, {
                scale: 2,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Status_Docas_JSL.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
